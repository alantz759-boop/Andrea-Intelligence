<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistant</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div class="topbar">
    <h1>Assistant</h1>
    <span><span class="status-dot online"></span><span style="font-size:12px;color:var(--text-muted)">Online</span></span>
  </div>

  <div id="joinScreen" class="join-screen">
    <div style="font-size:22px;font-weight:700;">Welcome to your AI* assistant</div>
    <input id="nameInput" type="text" placeholder="Your name (optional)" />
    <button id="joinBtn">Start chatting</button>
  </div>

  <div class="footnote">*Andrea Intelligence</div>

  <div id="chatWrap" class="chat-wrap" style="display:none;">
    <div id="messages" class="messages">
      <div id="emptyChatState" class="empty-chat-state">What can I moderately help you with?</div>
    </div>
    <div id="typingIndicator" class="typing-indicator" style="display:none;">Assistant is typing…</div>
    <div class="input-bar">
      <div class="input-row">
        <textarea id="textInput" rows="1" placeholder="Message the assistant…"></textarea>
        <button id="sendBtn" class="send-btn">➤</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
